# Fly.io — free tier friendly (auto-stop when idle, wakes on visit).
# Create volume once: fly volumes create appointment_data --region sin --size 1

app = "manicure-appointment-app"
primary_region = "sin"

[build]

[env]
  DATA_DIR = "/app/data"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "appointment_data"
  destination = "/app/data"
